<!--
  Lockdin School — Cognito Verification Code Email
  Paste this into: Cognito User Pool → Messaging (or Message customization)
  → Verification message → "Send email with a link/code" → HTML content

  IMPORTANT:
  1. Replace LOGO_URL_HERE with your hosted logo URL (must be a public HTTPS link)
  2. Keep {####} exactly as-is — Cognito replaces it with the actual code
  3. FROM address configured separately in Email configuration as:
     Lockdin School <noreply@lockdinschool.com>
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f0fff4; padding:40px 16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="max-width:480px; width:100%; background-color:#ffffff; border-radius:16px; border:1px solid #1e2914; overflow:hidden; box-shadow:0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.03);">

                <!-- Logo -->
                <tr>
                    <td align="center" style="padding:40px 40px 24px 40px;">
                        <img src="https://cdn.lockdinschool.com/logo-gw.svg" width="64" height="64" alt="Lockdin School" style="display:block; border-radius:50%;" />
                    </td>
                </tr>

                <!-- Heading -->
                <tr>
                    <td align="center" style="padding:0 40px;">
                        <h1 style="margin:0; font-size:22px; line-height:28px; font-weight:700; color:#000000;">
                            Verify your email
                        </h1>
                    </td>
                </tr>

                <!-- Body copy -->
                <tr>
                    <td align="center" style="padding:12px 40px 0 40px;">
                        <p style="margin:0; font-size:15px; line-height:22px; color:#1a1a1a;">
                            Welcome to <strong>Lockdin School</strong>. Use the code below to verify your email address and get started.
                        </p>
                    </td>
                </tr>

                <!-- Code block -->
                <tr>
                    <td align="center" style="padding:32px 40px 8px 40px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color:#e9ecef; border:1px solid rgba(0,255,17,0.5); border-radius:12px;">
                            <tr>
                                <td style="padding:18px 36px; font-size:32px; line-height:38px; font-weight:700; letter-spacing:8px; color:#000000; font-family:'Courier New',monospace;">
                                    {####}
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Expiry note -->
                <tr>
                    <td align="center" style="padding:16px 40px 0 40px;">
                        <p style="margin:0; font-size:13px; line-height:20px; color:#5a5a5a;">
                            This code expires in 24 hours. If you didn't request this, you can safely ignore this email.
                        </p>
                    </td>
                </tr>

                <!-- Divider -->
                <tr>
                    <td style="padding:32px 40px 0 40px;">
                        <div style="height:1px; background-color:#e9ecef; width:100%;"></div>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td align="center" style="padding:24px 40px 36px 40px;">
                        <p style="margin:0; font-size:12px; line-height:18px; color:#8a8a8a;">
                            Lockdin School · Sent to verify your account<br />
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
